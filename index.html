<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffd9a3">
<title>The Lab Perfume</title>
<meta name="description" content="Perfumes premium originales. Elige y pide por WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<style>
:root{
  --cocoa:#2a1606; --brown:#5a2a0c; --amber:#c8691d; --orange:#f0a35a; --peach:#f9b78a;
  --cream:#fff3dc; --sand:#ffe3b8; --line:#f0d2a8; --muted:#8a6a50;
  --serif:"DM Serif Display",Georgia,serif; --sans:"Manrope",system-ui,sans-serif;
  --glass:rgba(255,232,196,.62); --glass-b:rgba(255,255,255,.7);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:var(--sans);color:var(--cocoa);line-height:1.5;min-height:100vh;
  background:linear-gradient(145deg,#ffc489 0%,#ffdfb0 32%,#fff0c2 62%,#ffe27a 100%) fixed;padding-bottom:120px}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brown);outline-offset:3px}
.app{max-width:1080px;margin:0 auto;padding:18px 18px 0}

/* Encabezado */
.top{display:flex;align-items:center;gap:12px}
.logo{width:48px;height:48px;border-radius:50%;background:linear-gradient(145deg,#7a3410,#2a1606);color:#ffd98a;display:grid;place-items:center;font-family:var(--serif);font-size:1.3rem;border:2px solid #fff;box-shadow:0 4px 14px rgba(90,42,12,.28)}
.top b{display:block;font-size:.98rem;font-weight:700}
.top small{color:var(--muted);font-size:.76rem}
.brand b{font-family:var(--serif);font-weight:400;font-size:1.35rem;line-height:1.1}
.top .sp{flex:1}
.pill-btn{width:46px;height:46px;border-radius:50%;border:1px solid var(--glass-b);background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:grid;place-items:center;position:relative}
.pill-btn i{font-size:1.05rem;color:var(--cocoa)}
.badge{position:absolute;top:-3px;right:-3px;min-width:19px;height:19px;border-radius:10px;background:var(--amber);color:#fff;font-size:.7rem;font-weight:700;display:grid;place-items:center;padding:0 5px}

h1{font-family:var(--serif);font-weight:400;font-size:clamp(2rem,6.4vw,3.1rem);line-height:1.1;margin:24px 0 18px;max-width:15ch;color:var(--cocoa)}
.search{display:flex;align-items:center;gap:10px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--glass-b);border-radius:999px;padding:0 20px;height:54px;max-width:580px}
.search input{flex:1;border:0;background:none;font:inherit;font-size:.95rem;outline:none;color:var(--cocoa);min-width:0}
.search input::placeholder{color:var(--muted)}
.search i{font-size:1.05rem;color:var(--muted)}

/* Banner */
.banner{margin:22px 0 6px;border-radius:26px;overflow:hidden;position:relative;padding:24px 22px;min-height:210px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:14px;
  background:radial-gradient(circle at 82% 30%,rgba(255,214,140,.9),transparent 45%),linear-gradient(120deg,#9a5a1c,#c8862f 55%,#e8b25c);color:#fff;border:1px solid var(--glass-b)}
.banner p{font-weight:600;font-size:1.05rem;line-height:1.3;max-width:19ch;text-shadow:0 1px 8px rgba(60,28,6,.35)}
.banner a{background:#ffeccb;color:var(--cocoa);text-decoration:none;font-weight:700;font-size:.85rem;padding:9px 18px;border-radius:12px;box-shadow:0 3px 10px rgba(90,42,12,.25)}
.banner .bts{position:absolute;right:14px;top:14px;height:92px;display:flex;gap:6px;align-items:flex-end;opacity:.9;pointer-events:none}
.banner .bts svg{height:62px;width:auto}
.banner .bts svg:nth-child(2){height:84px}
.banner .bts svg:first-child{display:none}
@media(min-width:700px){.banner .bts{right:40px;top:50%;transform:translateY(-50%);height:190px}.banner .bts svg{height:120px}.banner .bts svg:nth-child(2){height:170px}.banner .bts svg:first-child{display:block}}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.banner .hero-shade{display:none;position:absolute;inset:0;background:linear-gradient(90deg,rgba(42,22,6,.72),rgba(42,22,6,.12) 72%)}
.banner.has-img .hero-shade{display:block}
.banner.has-img .bts{display:none}
.banner p,.banner a{position:relative;z-index:1}
.banner a i{margin-right:6px}
@media(min-width:700px){.banner{min-height:290px;padding:38px}.banner p{font-size:1.5rem}}

/* Secciones */
.sec{margin:26px 0 12px}
.sec h2{font-size:1rem;font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--glass-b);background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:8px 18px;border-radius:999px;font-size:.86rem;font-weight:600}
.chip small{opacity:.6;font-weight:700;margin-left:6px}
.chip[aria-pressed="true"] small{opacity:.85}
.lbl{font-size:.8rem;color:var(--muted);font-weight:700;margin:14px 0 6px}
.bh{font-family:var(--serif);font-weight:400;font-size:1.45rem;margin:28px 0 2px;display:flex;align-items:baseline;gap:10px}
.bh small{font-family:var(--sans);font-size:.78rem;color:var(--muted);font-weight:600}
.chip[aria-pressed="true"]{background:var(--brown);color:#fff;border-color:var(--brown)}

/* Tarjetas */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:16px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr);gap:20px}}
@media(min-width:960px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{border-radius:24px;background:linear-gradient(180deg,rgba(255,213,170,.85),rgba(255,196,140,.8));border:1px solid var(--glass-b);overflow:hidden;cursor:pointer;padding:6px;transition:transform .2s,box-shadow .2s;box-shadow:0 6px 18px rgba(150,80,20,.12)}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 28px rgba(150,80,20,.22)}
.pic{border-radius:19px;aspect-ratio:1/1.05;position:relative;overflow:hidden;display:grid;place-items:center}
.g0{background:radial-gradient(circle at 50% 70%,rgba(255,200,120,.7),transparent 60%),linear-gradient(150deg,#7a3410,#d87a2c)}
.g1{background:radial-gradient(circle at 50% 70%,rgba(255,190,110,.6),transparent 60%),linear-gradient(150deg,#3b1b07,#b8601a)}
.g2{background:radial-gradient(circle at 50% 70%,rgba(255,230,170,.7),transparent 60%),linear-gradient(150deg,#b86a2a,#f3b868)}
.pic img{width:100%;height:100%;object-fit:cover}
.pic svg.bt{width:44%;height:auto;filter:drop-shadow(0 8px 14px rgba(40,18,4,.4))}
.sz{position:absolute;top:9px;left:9px;background:rgba(42,22,6,.45);color:#fff;font-size:.72rem;font-weight:600;padding:2px 10px;border-radius:999px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.heart{position:absolute;top:7px;right:7px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.3);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;z-index:2}
.heart i{font-size:.95rem;color:#fff}
.cb{padding:10px 6px 6px}
.cb h3{font-size:.92rem;font-weight:700;line-height:1.25}
.cb .fam{font-size:.76rem;color:#7a5638;margin-top:1px}
.pr{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.pr b{font-size:1rem;font-weight:800}
.plus i{font-size:.8rem}
.plus{width:34px;height:34px;border-radius:50%;background:#fff;color:var(--cocoa);display:grid;place-items:center;font-size:1.3rem;line-height:1;box-shadow:0 2px 8px rgba(90,42,12,.2)}
.empty{padding:50px 0;color:var(--muted);text-align:center}

/* Barra inferior */
.dock{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:rgba(98,52,18,.52);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 10px 30px rgba(70,30,6,.35)}
.dock button{border:0;background:none;width:52px;height:46px;border-radius:999px;display:grid;place-items:center;color:#ffe9c8;position:relative}
.dock button:hover{background:rgba(255,255,255,.14)}
.dock i{font-size:1.2rem}
.dock .mid{width:60px;height:60px;margin:-4px 2px;background:radial-gradient(circle at 35% 30%,#ffe9b0,#e0a040 55%,#a8611a);box-shadow:0 4px 14px rgba(40,18,4,.45),inset 0 1px 2px rgba(255,255,255,.6);color:var(--cocoa)}
.dock .mid:hover{background:radial-gradient(circle at 35% 30%,#fff0c4,#ebb04c 55%,#b06a1c)}
.dock .badge{top:2px;right:6px}

/* WhatsApp flotante */
.wa{position:fixed;right:16px;bottom:calc(98px + env(safe-area-inset-bottom));z-index:41;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#c8691d,#5a2a0c);border:2px solid #ffd9a3;box-shadow:0 8px 24px rgba(70,30,6,.4);transition:transform .2s}
.wa:hover{transform:scale(1.06)}
.wa i{font-size:1.75rem;color:#ffe9c8}

footer{text-align:center;color:var(--muted);font-size:.82rem;padding:40px 0 10px}
footer a{color:var(--brown);font-weight:700}

/* Hojas (detalle y pedido) */
dialog{border:0;padding:0;background:transparent;max-width:none;max-height:none;width:100%;height:100%;overflow:hidden}
dialog::backdrop{background:rgba(42,22,6,.6);backdrop-filter:blur(3px)}
dialog[open]{display:flex;align-items:flex-end;justify-content:center}
.sheet{background:linear-gradient(170deg,#ffe3b8,#ffd08e 70%,#ffe08a);width:100%;max-width:560px;max-height:94vh;overflow:auto;border-radius:32px 32px 0 0;position:relative;animation:up .28s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.hero{position:relative;aspect-ratio:1/1;display:grid;place-items:center;overflow:hidden;border-radius:32px 32px 28px 28px;
  background:radial-gradient(ellipse at 50% 45%,rgba(255,176,70,.95),rgba(190,100,30,.55) 38%,transparent 70%),linear-gradient(180deg,#1e0d03,#5a2a0c 65%,#8a4a1c)}
.hero img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.hero svg.bt{width:32%;height:auto;position:relative;filter:drop-shadow(0 0 30px rgba(255,170,60,.7))}
.hbar{position:absolute;top:14px;left:14px;right:14px;display:flex;align-items:center;justify-content:space-between;z-index:3;color:#fff}
.hbar span{font-weight:600;font-size:1rem}
.hbar .pill-btn{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.4)}
.hbar .pill-btn i{color:#fff}
.stats{display:flex;gap:8px;position:absolute;left:12px;right:12px;bottom:12px;z-index:2}
.stat{flex:1;text-align:center;padding:9px 4px;border-radius:16px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff}
.stat b{display:block;font-size:1rem;font-weight:800}
.stat span{font-size:.7rem;opacity:.8}
.thumbs{display:flex;gap:8px;padding:12px 16px 0;overflow-x:auto}
.thumbs button{flex:none;width:54px;height:54px;border-radius:14px;border:2px solid transparent;padding:0;overflow:hidden;background:var(--sand)}
.thumbs button[aria-current="true"]{border-color:var(--amber)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.info{margin:12px 12px 14px;padding:18px 18px 16px;border-radius:26px;background:rgba(255,236,205,.78);border:1px solid var(--glass-b)}
.info .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.info h2{font-size:1.4rem;font-weight:800;line-height:1.15}
.info .sub{color:#7a5638;font-size:.88rem;margin-top:2px}
.info .price{font-size:1.8rem;font-weight:800;white-space:nowrap}
.info p{font-size:.86rem;color:#6e4e34;margin-top:10px}
.notes{margin-top:10px;font-size:.85rem;display:grid;gap:3px;color:#6e4e34}
.notes div{display:flex;gap:10px}
.notes b{min-width:68px;font-weight:700;color:var(--cocoa)}
.sizes{display:flex;gap:10px;margin:0 12px}
.sizes button{flex:1;padding:14px 6px;border-radius:18px;border:0;background:rgba(255,255,255,.4);font-weight:700;font-size:.98rem;color:#6e4e34}
.sizes button[aria-pressed="true"]{background:#fff;color:var(--cocoa);box-shadow:0 3px 10px rgba(120,60,10,.15)}
.cta{display:flex;align-items:center;justify-content:space-between;width:calc(100% - 24px);margin:14px 12px 0;padding:17px 22px;border:0;border-radius:999px;background:linear-gradient(135deg,#fbc29a,#f4a672);color:var(--cocoa);font-weight:800;font-size:1rem;box-shadow:0 6px 16px rgba(190,100,40,.3)}
.cta i{font-size:1rem}
.ask{display:block;text-align:center;margin:14px 0 20px;color:var(--brown);font-weight:700;font-size:.88rem}

/* Pedido */
.cart-h{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 4px}
.cart-h h2{font-family:var(--serif);font-weight:400;font-size:1.6rem}
.items{padding:6px 20px}
.it{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(150,80,20,.18)}
.it .t{flex:1;font-size:.92rem;font-weight:600}.it .t small{display:block;color:var(--muted);font-weight:500}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:30px;height:30px;border-radius:50%;border:0;background:#fff;line-height:1;font-weight:700}
.tot{padding:14px 20px 0;display:flex;justify-content:space-between;font-weight:800;font-size:1.05rem}
.cart-f{padding:4px 0 24px}
.none{padding:34px 20px;text-align:center;color:#7a5638}

@media(min-width:860px){
  dialog[open]{align-items:center}
  .sheet{border-radius:32px;max-width:920px;max-height:90vh}
  .sheet.pd{display:grid;grid-template-columns:1fr 1fr;overflow:hidden}
  .sheet.pd .l{overflow:auto;padding:10px}
  .sheet.pd .r{overflow:auto;max-height:90vh;padding-top:14px}
  .sheet.cartS{max-width:480px}
  .hero{aspect-ratio:auto;height:100%;min-height:480px;border-radius:26px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const expand = c => ({id:"cat-"+c.i, name:c.n, brand:c.b||"", concentration:c.c||"", category:c.k||"", currency:"USD", sizes:[{ml:c.m||null, price:c.p}], description:c.d||"", images:c.u?[c.u]:[], available:true});
const SAMPLE = CATALOG.map(expand);

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sym = c => c === "NIO" ? "C$" : "$";
const fmt = (n, c) => `${sym(c)}${Number(n||0).toLocaleString("es-NI")}`;
const waLink = t => `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(t)}`;
const subOf = p => [p.brand, p.concentration].filter(Boolean).join(" · ") || p.family || "";
const sizesOf = p => (p.sizes?.length ? p.sizes : [{ml:p.size, price:p.price}]).filter(s => s.price !== null && s.price !== "" && s.price !== undefined);
const BOTTLE = `<svg class="bt" viewBox="0 0 100 150" aria-hidden="true"><rect x="38" y="6" width="24" height="20" rx="3" fill="#f0b45a"/><rect x="43" y="26" width="14" height="8" fill="#ffd98a"/><rect x="18" y="34" width="64" height="106" rx="12" fill="rgba(255,255,255,.18)" stroke="rgba(255,255,255,.75)" stroke-width="2"/><rect x="26" y="70" width="48" height="62" rx="6" fill="rgba(255,170,70,.5)"/><rect x="34" y="48" width="32" height="14" rx="3" fill="none" stroke="rgba(255,255,255,.65)"/></svg>`;
const heartI = on => `<i class="fa-${on?'solid':'regular'} fa-heart"></i>`;

const store = (k, d) => { try { return JSON.parse(localStorage.getItem(k) || d); } catch { return JSON.parse(d); } };
const put = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

const OTRAS = "Otras marcas";
const brandOf = p => p.brand || OTRAS;
let products = [], cat = "Todos", brand = "Todos", term = "";
let cart = store("tlp_cart", "[]"), favs = store("tlp_fav", "[]");

const h = new Date().getHours();
$("#hi").textContent = h < 12 ? "Buenos días" : h < 19 ? "Buenas tardes" : "Buenas noches";
$("#bts").innerHTML = BOTTLE + BOTTLE + BOTTLE;
const hello = "Hola, quiero información sobre sus perfumes.";
$("#waFloat").href = waLink(hello);
$("#advice").href = waLink("Hola, ¿me recomiendan un perfume? Mi ocasión/estilo es: ");
$("#footWa").href = waLink(hello);
if (INSTAGRAM) $("#ig").innerHTML = ` · <a href="${esc(INSTAGRAM)}" target="_blank" rel="noopener"><i class="fa-brands fa-instagram"></i> Instagram</a>`;

function applyHero(d){
  if (d.heroText) $("#heroTxt").textContent = d.heroText;
  if (d.heroImage) { $("#heroImg").src = d.heroImage; $("#heroImg").hidden = false; $("#hero").classList.add("has-img"); }
}

async function load(){
  if (!FIREBASE.projectId) { products = SAMPLE; return render(); }
  try{
    const db = getFirestore(initializeApp(FIREBASE));
    try { const st = await getDoc(doc(db,"settings","site")); if (st.exists()) applyHero(st.data()); } catch(e){ console.warn(e); }
    const snap = await getDocs(query(collection(db,"products"), orderBy("createdAt","desc")));
    products = snap.docs.map(d => ({id:d.id, ...d.data()})).filter(p => p.available !== false);
  }catch(e){ console.error(e); products = []; }
  render();
}

function toggleFav(id){
  favs = favs.includes(id) ? favs.filter(x => x !== id) : [...favs, id];
  put("tlp_fav", favs); render();
}

function card(p, i){
  const s = sizesOf(p), first = s[0] || {};
  const price = s.length > 1 ? `<span style="font-size:.7rem;font-weight:600;color:#7a5638">Desde </span>${fmt(Math.min(...s.map(x=>+x.price)), p.currency)}` : fmt(first.price, p.currency);
  const fav = favs.includes(p.id);
  return `<article class="card" tabindex="0" role="button" data-id="${esc(p.id)}" aria-label="Ver ${esc(p.name)}">
    <div class="pic g${i%3}">${p.images?.[0] ? `<img loading="lazy" src="${esc(p.images[0])}" alt="${esc(p.name)}">` : BOTTLE}
      ${first.ml ? `<span class="sz">${esc(first.ml)} ml</span>` : ""}
      <button class="heart" data-fav="${esc(p.id)}" aria-pressed="${fav}" aria-label="Guardar en favoritos">${heartI(fav)}</button></div>
    <div class="cb"><h3>${esc(p.name)}</h3><div class="fam">${esc(subOf(p))}</div>
      <div class="pr"><b>${price}</b><span class="plus" aria-hidden="true"><i class="fa-solid fa-plus"></i></span></div></div>
  </article>`;
}

function render(){
  // Tipo (Sets, etc.)
  const cats = ["Todos", ...new Set(products.map(p => p.category).filter(Boolean))];
  if (!cats.includes(cat)) cat = "Todos";
  $("#chips").innerHTML = cats.length > 1 ? cats.map(c => `<button class="chip" aria-pressed="${c===cat}" data-c="${esc(c)}">${esc(c)}</button>`).join("") : "";
  $("#typeLbl").hidden = cats.length < 2;

  // Marcas con conteo, de la más vendida a la menos; "Otras marcas" al final
  const counts = {};
  products.forEach(p => { const b = brandOf(p); counts[b] = (counts[b] || 0) + 1; });
  const brands = Object.keys(counts).sort((a,b) => (a===OTRAS) - (b===OTRAS) || counts[b] - counts[a] || a.localeCompare(b));
  if (brand !== "Todos" && !counts[brand]) brand = "Todos";
  $("#brands").innerHTML = brands.length > 1 ? ["Todos", ...brands].map(b => `<button class="chip" aria-pressed="${b===brand}" data-b="${esc(b)}">${esc(b)}${b==="Todos" ? "" : `<small>${counts[b]}</small>`}</button>`).join("") : "";
  $("#brandLbl").hidden = brands.length < 2;

  const list = products
    .filter(p => (cat==="Todos" || p.category===cat) && (brand==="Todos" || brandOf(p)===brand) && `${p.name} ${p.brand||""}`.toLowerCase().includes(term))
    .sort((a,b) => (b.featured?1:0) - (a.featured?1:0));
  const groups = {};
  list.forEach(p => (groups[brandOf(p)] ||= []).push(p));
  let n = 0;
  $("#grid").innerHTML = brands.filter(b => groups[b]).map(b => {
    const g = groups[b];
    return `<h3 class="bh">${esc(b)}<small>${g.length} ${g.length === 1 ? "perfume" : "perfumes"}</small></h3><div class="grid">${g.map(p => card(p, n++)).join("")}</div>`;
  }).join("");
  $("#empty").hidden = list.length > 0;
}

/* ---- Detalle ---- */
function openProduct(id){
  const p = products.find(x => x.id === id); if(!p) return;
  const sizes = sizesOf(p), imgs = p.images || [];
  let sel = 0;
  const stats = [["Duración",p.longevity],["Familia",p.family],["Proyección",p.projection]].filter(s => s[1]);
  const notes = [["Salida",p.notesTop],["Corazón",p.notesHeart],["Fondo",p.notesBase]].filter(n => n[1]);
  const dlg = $("#dlg");
  dlg.innerHTML = `<div class="sheet pd">
    <div class="l">
      <div class="hero">${imgs[0] ? `<img id="mm" src="${esc(imgs[0])}" alt="${esc(p.name)}">` : BOTTLE}
        <div class="hbar">
          <button class="pill-btn" id="bk" aria-label="Cerrar"><i class="fa-solid fa-chevron-left"></i></button>
          <span>Detalles</span>
          <button class="pill-btn" id="fv" aria-pressed="${favs.includes(p.id)}" aria-label="Guardar en favoritos">${heartI(favs.includes(p.id))}</button>
        </div>
        ${stats.length ? `<div class="stats">${stats.map(s=>`<div class="stat"><b>${esc(s[1])}</b><span>${s[0]}</span></div>`).join("")}</div>` : ""}
      </div>
      ${imgs.length > 1 ? `<div class="thumbs">${imgs.map((u,i)=>`<button data-i="${i}" aria-current="${i===0}" aria-label="Foto ${i+1}"><img src="${esc(u)}" alt=""></button>`).join("")}</div>` : ""}
    </div>
    <div class="r">
      <div class="info">
        <div class="row1"><div><h2>${esc(p.name)}</h2><div class="sub">${esc([p.brand, p.concentration, p.category].filter(Boolean).join(" · "))}</div></div><div class="price" id="pp"></div></div>
        ${p.description ? `<p>${esc(p.description)}</p>` : ""}
        ${notes.length ? `<div class="notes">${notes.map(n=>`<div><b>${n[0]}</b><span>${esc(n[1])}</span></div>`).join("")}</div>` : ""}
      </div>
      <div class="sizes" id="sz">${sizes.map((s,i)=>`<button data-s="${i}" aria-pressed="${i===0}">${s.ml ? esc(s.ml) + " ml" : "Único"}</button>`).join("")}</div>
      <button class="cta" id="add"><span>Añadir al pedido</span><span id="ctaP" style="display:flex;align-items:center;gap:8px"></span></button>
      <a class="ask" target="_blank" rel="noopener" href="${waLink(`Hola, tengo una pregunta sobre ${p.name} de The Lab Perfume.`)}"><i class="fa-brands fa-whatsapp"></i> Preguntar por este perfume</a>
    </div></div>`;
  const arrow = `<i class="fa-solid fa-arrow-right"></i>`;
  const paint = () => { const s = sizes[sel] || {}; $("#pp").textContent = fmt(s.price, p.currency); $("#ctaP").innerHTML = `${fmt(s.price, p.currency)} ${arrow}`; };
  paint();
  $("#bk").onclick = () => dlg.close();
  $("#fv").onclick = e => { toggleFav(p.id); const on = favs.includes(p.id); e.currentTarget.setAttribute("aria-pressed", on); e.currentTarget.innerHTML = heartI(on); };
  dlg.querySelectorAll("#sz button").forEach(b => b.onclick = () => { sel = +b.dataset.s; dlg.querySelectorAll("#sz button").forEach(x => x.setAttribute("aria-pressed", x===b)); paint(); });
  dlg.querySelectorAll(".thumbs button").forEach(b => b.onclick = () => { $("#mm").src = imgs[b.dataset.i]; dlg.querySelectorAll(".thumbs button").forEach(x => x.setAttribute("aria-current", x===b)); });
  $("#add").onclick = () => {
    const s = sizes[sel] || {}, key = `${p.id}|${s.ml}`;
    const ex = cart.find(c => c.key === key);
    if (ex) ex.qty++; else cart.push({key, name:p.name, ml:s.ml, price:+s.price, currency:p.currency || "USD", qty:1});
    put("tlp_cart", cart); updateBadge(); dlg.close(); openCart();
  };
  dlg.showModal();
}

/* ---- Pedido ---- */
function updateBadge(){
  const n = cart.reduce((a,c) => a + c.qty, 0);
  for (const id of ["#badge","#badgeTop"]) { $(id).textContent = n; $(id).hidden = n === 0; }
}
function totals(){
  const t = {}; cart.forEach(c => t[c.currency] = (t[c.currency]||0) + c.price*c.qty);
  return Object.entries(t).map(([c,v]) => fmt(v,c)).join(" + ");
}
function openCart(){
  const d = $("#cartDlg");
  const body = cart.length ? `
    <div class="items">${cart.map((c,i)=>`<div class="it"><div class="t">${esc(c.name)}<small>${c.ml ? esc(c.ml)+" ml · " : ""}${fmt(c.price,c.currency)}</small></div>
      <div class="qty"><button data-m="${i}" aria-label="Quitar uno">−</button><b>${c.qty}</b><button data-p="${i}" aria-label="Añadir uno">+</button></div></div>`).join("")}</div>
    <div class="tot"><span>Total</span><span>${totals()}</span></div>
    <div class="cart-f"><button class="cta" id="send"><span>Enviar pedido por WhatsApp</span><i class="fa-solid fa-arrow-right"></i></button></div>`
    : `<div class="none">Tu pedido está vacío. Elige un perfume y presiona “Añadir al pedido”.</div>`;
  d.innerHTML = `<div class="sheet cartS"><div class="cart-h"><h2>Mi pedido</h2><button class="pill-btn" id="cx" aria-label="Cerrar"><i class="fa-solid fa-xmark"></i></button></div>${body}</div>`;
  $("#cx").onclick = () => d.close();
  d.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { const i=+b.dataset.m; if(--cart[i].qty<=0) cart.splice(i,1); put("tlp_cart", cart); updateBadge(); openCart(); });
  d.querySelectorAll("[data-p]").forEach(b => b.onclick = () => { cart[+b.dataset.p].qty++; put("tlp_cart", cart); updateBadge(); openCart(); });
  const send = $("#send");
  if (send) send.onclick = () => {
    const lines = cart.map(c => `• ${c.qty} x ${c.name}${c.ml ? ` (${c.ml} ml)` : ""} — ${fmt(c.price*c.qty, c.currency)}`).join("\n");
    window.open(waLink(`Hola, quiero hacer este pedido en The Lab Perfume:\n${lines}\nTotal: ${totals()}`), "_blank", "noopener");
  };
  if (!d.open) d.showModal();
}

/* ---- Eventos ---- */
$("#chips").addEventListener("click", e => { const b=e.target.closest("[data-c]"); if(b){cat=b.dataset.c; render();} });
$("#brands").addEventListener("click", e => { const b = e.target.closest("[data-b]"); if (b) { brand = b.dataset.b; render(); } });
$("#q").addEventListener("input", e => { term = e.target.value.trim().toLowerCase(); render(); });
const onGrid = e => {
  const f = e.target.closest("[data-fav]");
  if (f) { e.stopPropagation(); return toggleFav(f.dataset.fav); }
  const c = e.target.closest(".card"); if (c) openProduct(c.dataset.id);
};
$("#grid").addEventListener("click", onGrid);
$("#grid").addEventListener("keydown", e => { if ((e.key==="Enter"||e.key===" ") && e.target.classList.contains("card")) { e.preventDefault(); onGrid(e); } });
for (const id of ["#dlg","#cartDlg"]) $(id).addEventListener("click", e => { if(e.target.id === id.slice(1)) e.target.close(); });
$("#openCart").onclick = openCart; $("#openCartTop").onclick = openCart;
$("#goHome").onclick = () => window.scrollTo({top:0,behavior:"smooth"});
$("#goColec").onclick = () => $("#colec").scrollIntoView({behavior:"smooth"});

applyHero({heroImage: HERO_IMAGE});
updateBadge(); load();
</script>
</body>
</html>
